# Docker Compose configuration for Targeting Engine
# This file defines the services required to run the Targeting Engine application
services:
  app:
    build: .
    container_name: targeting-engine
    ports:
      - "8080:8080"
      - "6060:6060" # Prometheus metrics endpoint
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    container_name: targeting-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: krishna
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: targeting-redis
    ports:
      - "6379:6379"
